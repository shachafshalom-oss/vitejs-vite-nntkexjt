# ==========================================
# Steel & Spirit — הגדרות Netlify
# ==========================================
# הקובץ הזה נוצר במטרה אחת: להגדיר את lead-notifier כפונקציה מתוזמנת.
#
# רקע: הגדרת תזמון בתוך קוד הפונקציה (exports.config) עובדת רק בפורמט
# המודרני של Netlify (ESM עם export const config). הפונקציות כאן כתובות
# בפורמט CommonJS, ולכן ההגדרה שם לא נקראה — והפונקציה נרשמה כפונקציית
# HTTP רגילה שאף אחד לא מפעיל. זו הסיבה שלא רצה אף פעם ולא הופיעו לוגים.
#
# ⚠️ סקשן [build] נוסף ב-29.9.2026 (באישור שחף) כדי שבדיקות התהליכים ירוצו בכל פריסה:
# "npm run build" מריץ קודם את tests/ (npm run test:flows) ורק אם הכול עבר — vite build.
# בדיקה שנכשלת = הבנייה נכשלת = הגרסה החדשה לא עולה, והאתר נשאר על הגרסה הקודמת.
# הסקשן גובר על ההגדרות בממשק של Netlify; publish = "dist" זהה לברירת המחדל של Vite.
# במצב חירום בלבד (למשל תיקון דחוף כשהבדיקות עצמן שבורות) אפשר לשנות זמנית ל-
# "npm run build:skip-tests" — ולהחזיר מיד אחרי.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # תואם להגדרה הקיימת בממשק ("Custom functions path")
  directory = "netlify/functions"

[functions."lead-notifier"]
  # כל 5 דקות. הסינון לשעון ישראל ולשעת הדיגסט נעשה בתוך הקוד עצמו,
  # כדי שמעבר לשעון קיץ/חורף לא יזיז את שעת השליחה.
  schedule = "*/5 * * * *"
